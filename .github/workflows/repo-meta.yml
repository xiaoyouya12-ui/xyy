name: Sync Repo Metadata

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/repo-meta.yml'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update repo metadata and report via issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          LOG=/tmp/meta-diag.txt
          {
            echo "### gh auth status"
            gh auth status 2>&1 | head -10
            echo
            echo "### PATCH description/homepage"
            gh api --method PATCH "repos/${REPO}" \
              -f description="聚合百度 / 夸克 / 迅雷网盘入口的静态导航站，Vue 3 + Vite + PWA，可添加到手机主屏" \
              -f homepage="https://xiaoyouya12-ui.github.io/xyy/" \
              --jq '{description, homepage}' 2>&1 | head -25
            echo
            echo "### PUT topics"
            echo '{"names":["vue","vite","pwa","netdisk","pan-nav","navigation","static-site","github-pages"]}' > /tmp/topics.json
            gh api --method PUT "repos/${REPO}/topics" --input /tmp/topics.json --jq '.names' 2>&1 | head -25
            echo
            echo "### 最终回读"
            gh api "repos/${REPO}" --jq '{description, homepage, topics}' 2>&1 | head -10
          } > "$LOG" 2>&1
          cat "$LOG"
          echo
          echo "### 发 issue 上报 =="
          {
            echo "自动诊断报告 — $(date -u +%FT%TZ)"
            echo
            echo '```'
            cat "$LOG"
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$REPO" --title "meta-sync diagnostic" --body-file /tmp/body.md 2>&1 | head -5
          echo "issue create exit=$?"
