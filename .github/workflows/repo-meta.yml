name: Sync Repo Metadata

# 用途：把 .github/repo-meta.yml 里配置的 description / homepage / topics
#       同步到 GitHub 仓库设置。改完配置手动跑一次即可生效。
#
# 注意：GitHub 内置的 GITHUB_TOKEN 没有改仓库元数据的权限
#      （会返回 403 Resource not accessible by integration），
#      所以这里用仓库级 Secret：PAT_TOKEN
#      所需 PAT 权限：Repository permissions → Metadata: Read and write
#
# 触发：Actions 页面手动 Run workflow / workflow_dispatch，或改动本文件时自动跑。

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/repo-meta.yml'
      - '.github/repo-meta.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update description / homepage / topics
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::未配置 Secret PAT_TOKEN。请到 Settings → Secrets and variables → Actions 添加（权限选 Metadata: Read and write）。"
            exit 1
          fi

          CFG=.github/repo-meta.yml
          DESCRIPTION=$(yq -r '.description' "$CFG")
          HOMEPAGE=$(yq -r '.homepage' "$CFG")
          TOPICS=$(yq -r '.topics | join(",")' "$CFG")

          echo "== 读取配置 =="
          echo "description: ${DESCRIPTION}"
          echo "homepage:    ${HOMEPAGE}"
          echo "topics:      ${TOPICS}"

          echo
          echo "== 1/3 更新 description / homepage =="
          gh api --method PATCH "repos/${REPO}" \
            -f description="${DESCRIPTION}" \
            -f homepage="${HOMEPAGE}" \
            --jq '{description, homepage}'

          echo
          echo "== 2/3 更新 topics =="
          echo "${TOPICS}" | tr ',' '\n' | jq -R . | jq -s '{names: .}' > /tmp/topics.json
          gh api --method PUT "repos/${REPO}/topics" --input /tmp/topics.json --jq '.names'

          echo
          echo "== 3/3 回读校验 =="
          gh api "repos/${REPO}" --jq '{description, homepage, topics}'
