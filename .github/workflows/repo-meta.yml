name: Sync Repo Metadata

# 只在手动触发或本文件变更时运行，避免每次 push 都白跑
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/repo-meta.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update repo metadata and write diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          {
            echo "## 运行时间: $(date -u +%FT%TZ)"
            echo
            echo "### gh auth status"
            gh auth status 2>&1 | head -10
            echo
            echo "### 当前元数据"
            gh api "repos/${REPO}" --jq '{description, homepage, topics}' 2>&1 | head -10
            echo
            echo "### PATCH description/homepage"
            gh api --method PATCH "repos/${REPO}" \
              -f description="聚合百度 / 夸克 / 迅雷网盘入口的静态导航站，Vue 3 + Vite + PWA，可添加到手机主屏" \
              -f homepage="https://xiaoyouya12-ui.github.io/xyy/" \
              --jq '{description, homepage}' 2>&1 | head -20
            echo
            echo "### PUT topics"
            echo '{"names":["vue","vite","pwa","netdisk","pan-nav","navigation","static-site","github-pages"]}' > /tmp/topics.json
            gh api --method PUT "repos/${REPO}/topics" --input /tmp/topics.json --jq '.names' 2>&1 | head -20
            echo
            echo "### 最终回读"
            gh api "repos/${REPO}" --jq '{description, homepage, topics}' 2>&1 | head -10
          } > /tmp/meta-diag.md 2>&1
          cat /tmp/meta-diag.md
          echo
          echo "### 写回仓库供本地查看"
          mkdir -p .github/diag
          cp /tmp/meta-diag.md .github/diag/meta-log.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/diag/meta-log.md
          git commit -m "chore(diag): 记录元数据同步诊断日志" 2>&1 | tail -3
          git push origin HEAD:refs/heads/diag-meta 2>&1 | tail -3
